document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e:'Rail siding, first light', note:'Six frames of the same siding, minutes apart. Only the fourth was printed; the rest are here for the light.', f1:'50MM', f2:'HP5', f3:'CONTACT SHEET' },\n  { id:'v3b', vol:2, kind:'PLATE', num:'04', title:'Fence, after weather', note:'Taken from the road. The post at centre had already gone over when this was made.', f1:'90MM', f2:'FP4', f3:'PLATE — UNTRIMMED' },\n  { id:'v3c', vol:5, kind:'PLATE', num:'07', title:'Doorway, borrowed key', note:'A room the operator was allowed into once. Nothing in it was moved.', f1:'35MM', f2:'DELTA 100', f3:'PRINT — WARM TONE' },\n  { id:'v3d', vol:2, kind:'PLATE', num:'09', title:'Water, no horizon', note:'Held long enough that the surface stopped reading as water.', f1:'50MM', f2:'TRI-X', f3:'PLATE — MOUNTED' }\n];\n\nconst VOL5 = [\n  { id:'v5a', vol:8, kind:'PROTOCOL', num:'11', title:'Queue', state:'DRAFT', note:'One line, one clerk, no visible end. The draft has no failure state because none was needed.', f1:'ONE KEY', f2:'UNTIMED', f3:'D-1' },\n  { id:'v5b', vol:8, kind:'PROTOCOL', num:'12', title:'Two Ledgers', state:'DRAFT', note:'Both balance. Only one is true. The player is not told which and cannot check.', f1:'MOUSE', f2:'20 MIN', f3:'D-1' },\n  { id:'v5c', vol:8, kind:'PROTOCOL', num:'13', title:'Inheritance', state:'ABANDONED', note:'Abandoned at the point where it stopped being a game about chance.', f1:'POINTER', f2:'—', f3:'D-2' }\n];\n\nconst VOL_ADD = [\n  { id:'w01', vol:1, kind:'PLATE', num:'01', title:'Mallards, leaving the shallows', img:'uploads/DSCF0972.jpg', note:'Two off the water within a second of each other. Shot from the bank at the rocks, cropped only at the bottom edge.', f1:'400MM', f2:'DIGITAL', f3:'PLATE — FILED' },\n  { id:'w02', vol:1, kind:'PLATE', num:'02', title:'Fox, verge at dusk', note:'Grain kept as shot. Any cleaner and it stops being the same evening.', f1:'300MM', f2:'DIGITAL', f3:'PLATE — FILED' },\n  { id:'a01', vol:4, kind:'PLATE', num:'01', title:'Wing mirror, wet lot', note:'The car is incidental. The lot had just been rained on and everything in it doubled.', f1:'35MM', f2:'PORTRA 400', f3:'PRINT — WARM TONE' },\n  { id:'a02', vol:4, kind:'PLATE', num:'02', title:'Six cars, one row', note:'Shot flat and square so nothing gets to be the hero.', f1:'50MM', f2:'DIGITAL', f3:'PLATE — FILED' },\n  { id:'m01', vol:3, kind:'PLATE', num:'01', title:'Frost, north sill', note:'Two seconds at f/16, mirror up, no wind. The pattern was gone within the hour.', f1:'100MM', f2:'DIGITAL', f3:'PLATE — FILED' }\n];\n\nconst VOL9 = [\n  { id:'v9a', vol:9, kind:'PROTOCOL', num:'01', title:'Test Pattern', state:'MOUNTED', note:'Written to prove the console could load anything at all. Kept for that reason only.', f1:'ANY KEY', f2:'2 MIN', f3:'S-1' },\n  { id:'v9b', vol:9, kind:'PLATE', num:'01', title:'Bench, first exposure', note:'The workshop, badly lit, before any of this worked.', f1:'50MM', f2:'FP4', f3:'PLATE — LOOSE' }\n];\n\nconst VOL0 = [\n  { id:'c01', vol:0, kind:'NOTE', num:'01', title:'Housing, Mk I through Mk XII', note:'The first shell was card and tape, cut to the size of a tube that had not been chosen yet. Twelve marks followed. Mk IV — codename TALLOW — was the first that could be set down on a desk without collapsing; Mk IX (BRIAR) introduced the moulded lip and the screw rows; Mk XII (HOLLOWAY) is what stands here. Forty-one recorded revisions in total, most of them a millimetre of radius or a shade of tan.', f1:'MK XII', f2:'HOLLOWAY', f3:'41 REVISIONS' },\n  { id:'c02', vol:0, kind:'NOTE', num:'02', title:'Tube geometry', note:'The glass went through six curvatures before this one. Earlier marks bent the image so far that text at the corners could not be read; later ones were so flat the housing stopped reading as a tube at all. The seated angle is deliberate — the tube sits half a degree out of true, as it did in the first working unit, and was never corrected.', f1:'REV. 6', f2:'OSSIA', f3:'0.45° OFF TRUE' },\n  { id:'c03', vol:0, kind:'NOTE', num:'03', title:'Panel, three layouts', note:'Layout A put every control on one bar and could not be read. Layout B split them into modules and looked like a rack unit from a decade too late. Layout C — the present one — groups by function and prints the legend above the switch, which is how the panel was labelled on the machines this borrows from.', f1:'LAYOUT C', f2:'MERIDIAN', f3:'3 BUILDS' }\n];\n\nconst VOL6 = [];\n\nconst VOLUMES = [\n  { vol:1, name:'Wildlife', sub:'field, long lens', label:'WILDLIFE · VOL. 1', spine:'VOL. 1', tint:'#a9b78f' },\n  { vol:2, name:'Landscape', sub:'wide country, weather', label:'LANDSCAPE · VOL. 2', spine:'VOL. 2', tint:'#9fb3b7' },\n  { vol:3, name:'Macro', sub:'close work', label:'MACRO · VOL. 3', spine:'VOL. 3', tint:'#c7ab8a' },\n  { vol:4, name:'Automotive', sub:'machines, meets', label:'AUTOMOTIVE · VOL. 4', spine:'VOL. 4', tint:'#b59ba0' },\n  { vol:5, name:'Street', sub:'towns, people, signs', label:'STREET · VOL. 5', spine:'VOL. 5', tint:'#c9b48c' },\n  { vol:7, name:'Applications', sub:'games and tools', label:'APPLICATIONS · VOL. 7', spine:'VOL. 7', tint:'#c0ae91' },\n  { vol:8, name:'Drafts', sub:'unfinished', label:'DRAFTS · VOL. 8', spine:'VOL. 8', tint:'#b8a7ad' },\n  { vol:9, name:'Scratch', sub:'unfiled', label:'SCRATCH · VOL. 9', spine:'VOL. 9', tint:'#a9a5b3' },\n  { vol:0, name:'Colophon', sub:'the machine', label:'COLOPHON · VOL. 0', spine:'VOL. 0', tint:'#b8ae95' },\n  { vol:6, name:'Unreadable', sub:'surface damage', label:'—— VOL. 6', spine:'VOL. 6', tint:'#8f7f74', corrupt:true }\n];\n\nconst RACK_SLOTS = Array.from({ length: 10 }, (_, i) => i);\nconst GARBLE = '▚▓▒░█▞▟▙◣◤▤▥╳╱╲┼※';\n\nconst BOOT = [\n  'UNIT 7 — ARCHIVE CONSOLE',\n  'POWER .......................... OK',\n  'PHOSPHOR TUBE WARM-UP .......... 4.2 S',\n  'MEMORY BANK A .................. 14 ENTRIES',\n  'PLATE READER ................... READY',\n  'MISINFORMATION ................. SPREADING',\n  'OPERATOR MORALE ................ WITHIN TOLERANCE',\n  'PROTOCOL SHELF ................. MOUNTED',\n  'OPERATOR ABSENT — RESUMING UNATTENDED DISPLAY'\n];\n\nconst CHANNELS = [\n  { key:'all', label:'INDEX', deg:-42 },\n  { key:'PROTOCOL', label:'PROTOCOLS', deg:-14 },\n  { key:'studio', label:'STUDIO', deg:14 },\n  { key:'settings', label:'SETTINGS', deg:42 }\n];\n\nconst RIVETS = Array.from({ length: 22 }, (_, i) => ({ i }));\nconst ALL_ENTRIES = () => ENTRIES.concat(VOL0, VOL3, VOL5, VOL6, VOL9, VOL_ADD);\n\n\nconst RIVETS_TOP = Array.from({ length: 8 }, (_, i) => ({ i }));\nconst LOUVERS = Array.from({ length: 5 }, (_, i) => ({ i }));\nconst VENT_ANGLES = [0, -34, -18, 18, 34];\nconst SORTS = [ { key:'num', label:'NO.' }, { key:'title', label:'TITLE' }, { key:'kind', label:'KIND' } ];\nconst KINDS = [ { key:'all', label:'ALL' }, { key:'PROTOCOL', label:'PROTOCOLS' }, { key:'PLATE', label:'PLATES' } ];\n\nconst CODE_BARS = [2,1,3,1,1,2,1,3,2,1,1,2].map(n => ({ w: n + 'px' }));\nconst PINS = Array.from({ length: 9 }, (_, i) => ({ i }));\nconst DIPS = [true, false, true, true].map(on => ({ bg: on ? 'linear-gradient(#d9cdb8,#a89b85)' : 'linear-gradient(#3a3532,#242120)' }));\nconst CLIMATE_MODES = [\n  { key:'off', label:'OFF' },\n  { key:'vent', label:'VENT' },\n  { key:'heat', label:'HEAT' },\n  { key:'cool', label:'COOL' }\n];\n\nconst STUDIO = [\n  { name:'VISUAL FREQUENCIES STUDIOS', role:'BUILT FOR A FRIEND', status:'VISIT', url:'https://visualfrequenciesstudios.com' }\n];\n\nconst VFDS = [\n  { key:'amber', name:'AMBER', hex:'#f0a53a' },\n  { key:'ice', name:'ICE BLUE', hex:'#7fd0e8' },\n  { key:'jade', name:'JADE', hex:'#79dfa4' },\n  { key:'ember', name:'EMBER', hex:'#ff7a55' },\n  { key:'bone', name:'BONE', hex:'#e9e4d8' },\n  { key:'violet', name:'VIOLET', hex:'#b79bea' }\n];\n\nconst SCREENS = [\n  { key:'ember',  name:'EMBER',  scr:'#100d09', deep:'#0b0906', card:'#151009', ph:'#efa957', dim:'#b57a37', two:'#d9b078' },\n  { key:'olive',  name:'OLIVE',  scr:'#0d1109', deep:'#080b06', card:'#101408', ph:'#9fd48a', dim:'#6d9a5c', two:'#b7d9a4' },\n  { key:'ice',    name:'ICE',    scr:'#090f12', deep:'#060b0e', card:'#0c1418', ph:'#7fd0e8', dim:'#4f8ea3', two:'#a6dced' },\n  { key:'signal', name:'SIGNAL', scr:'#120a09', deep:'#0c0605', card:'#170c0a', ph:'#e58a72', dim:'#a25a48', two:'#efab98' },\n  { key:'slate',  name:'SLATE',  scr:'#0b0d10', deep:'#07090b', card:'#0f1216', ph:'#bcc6cd', dim:'#7c878e', two:'#d3dade' },\n  { key:'paper',  name:'PAPER',  scr:'#ddd3bc', deep:'#cfc4a9', card:'#e6ddc9', ph:'#3c2e1d', dim:'#7a6a52', two:'#4d3d28' }\n];\n\nconst WALLS = [\n  { key:'tan', name:'WARM TAN', hex:'#d3ba9b' },\n  { key:'oat', name:'OAT', hex:'#cfc7b4' },\n  { key:'bone', name:'BONE', hex:'#e4dbc9' },\n  { key:'putty', name:'PUTTY', hex:'#c3b6a3' },\n  { key:'clay', name:'CLAY', hex:'#b98d72' },\n  { key:'terra', name:'TERRACOTTA', hex:'#a9694f' },\n  { key:'drab', name:'FIELD DRAB', hex:'#9a9a7c' },\n  { key:'moss', name:'MOSS', hex:'#7d8a6a' },\n  { key:'sage', name:'SAGE', hex:'#adb79f' },\n  { key:'slate', name:'SLATE', hex:'#9aa3a6' },\n  { key:'stormcloud', name:'STORMCLOUD', hex:'#6f7a80' },\n  { key:'petrol', name:'PETROL', hex:'#4f6469' },\n  { key:'plum', name:'DUSTY PLUM', hex:'#8b7079' },\n  { key:'walnut', name:'WALNUT', hex:'#6b5241' },\n  { key:'espresso', name:'ESPRESSO', hex:'#3f322a' },\n  { key:'ink', name:'INK', hex:'#2c2f33' }\n];\n\nclass Component extends DCLogic {\n  static clockNow() {\n    const d = new Date();\n    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');\n  }\n\n  state = { booting:false, bootN:0, channel:'all', selId:'p04', idle:false, scan:true, glow:true, persist:false, wall:'petrol', screen:'ember', glass:0, narrow:false, sheet:'list', media:true, vfd:'amber', turbo:false, power:true, clock: Component.clockNow(), temp:68, fan:2, mode:'vent', recirc:false, vents:[0, 3], corners:0, turboFlips:0, warming:false, halted:false, sort:'num', sortDir:1, kind:'all', lastAction:'insert', mounted:5, drawer:false, query:'', lightbox:false, corrupt:false, recent:[], zoom:1 };\n\n  setRoot = el => { this._root = el; this.applySkin(); };\n\n  readHash() {\n    const m = (location.hash || '').replace('#', '').split('/');\n    const vol = /^vol(\\d+)$/i.test(m[0]) ? parseInt(m[0].slice(3), 10) : null;\n    return { vol, slug: m[1] || null };\n  }\n\n  writeHash(sel) {\n    const h = '#vol' + this.state.mounted + (sel ? '/' + sel.id : '');\n    if (location.hash !== h) history.replaceState(null, '', h);\n  }\n\n  componentDidMount() {\n    const link = this.readHash();\n    if (link.vol !== null && VOLUMES.some(v => v.vol === link.vol)) {\n      const entry = link.slug && ALL_ENTRIES().find(e => e.id === link.slug && e.vol === link.vol);\n      this.setState({ mounted: link.vol, selId: entry ? entry.id : null });\n    }\n    this.applySkin();\n    let seen = false;\n    try { seen = sessionStorage.getItem('unit7-booted') === '1'; } catch (e) {}\n    if (this.props.bootSequence !== false && !seen) this.startBoot();\n    this._keys = (e) => {\n      if (this.state.booting) { this.skip(); return; }\n      this.wake();\n      if (!this.state.power || !this.state.media) return;\n      if (e.target && e.target.tagName === 'INPUT' && e.key !== 'Escape') return;\n      const k = e.key;\n      if (k === 'Escape') {\n        e.preventDefault();\n        if (this.state.lightbox) this.setState({ lightbox:false }); else this.setChannel('all');\n        return;\n      }\n      if (k === 'Enter') {\n        const cur = this.volEntries().find(x => x.id === this.state.selId);\n        if (cur && cur.kind === 'PLATE') { e.preventDefault(); this.setState({ lightbox:true }); }\n        return;\n      }\n      if (k === 'ArrowLeft' || k === 'ArrowRight') {\n        e.preventDefault();\n        const i = CHANNELS.findIndex(c => c.key === this.state.channel);\n        const n = (i + (k === 'ArrowRight' ? 1 : CHANNELS.length - 1)) % CHANNELS.length;\n        this.setChannel(CHANNELS[n].key);\n        return;\n      }\n      if (k === 'ArrowUp' || k === 'ArrowDown') {\n        const list = this.visible();\n        if (!list.length) return;\n        e.preventDefault();\n        const i = Math.max(0, list.findIndex(x => x.id === this.state.selId));\n        const n = (i + (k === 'ArrowDown' ? 1 : list.length - 1)) % list.length;\n        this.setState({ selId: list[n].id });\n      }\n    };\n    window.addEventListener('keydown', this._keys);\n    window.addEventListener('mousemove', this.wake);\n    window.addEventListener('click', this.wake);\n    this._fit = () => {\n      const w = window.innerWidth;\n      const z = Math.max(0.34, Math.min(1, (w - 56) / 1180));\n      const narrow = w < 780;\n      if (Math.abs(z - this.state.zoom) > 0.005 || narrow !== this.state.narrow) this.setState({ zoom: z, narrow });\n    };\n    this._fit();\n    window.addEventListener('resize', this._fit);\n    this._tick = setInterval(() => { this.checkIdle(); const c = Component.clockNow(); if (c !== this.state.clock) this.setState({ clock:c }); }, 1000);\n    this.last = Date.now();\n  }\n  componentDidUpdate() {\n    this.applySkin();\n    const sel = this.volEntries().find(e => e.id === this.state.selId);\n    this.writeHash(sel);\n  }\n  componentWillUnmount() {\n    clearInterval(this._tick); clearInterval(this._boot); clearInterval(this._corners);\n    window.removeEventListener('keydown', this._keys);\n    window.removeEventListener('mousemove', this.wake);\n    window.removeEventListener('click', this.wake);\n    window.removeEventListener('resize', this._fit);\n  }\n\n  applySkin() {\n    const el = this._root;\n    if (!el) return;\n    const sc = SCREENS.find(x => x.key === this.state.screen) || SCREENS[0];\n    const w = WALLS.find(x => x.key === this.state.wall) || WALLS[0];\n    const v = VFDS.find(x => x.key === this.state.vfd) || VFDS[0];\n    const on = this.state.power;\n    const skin = {\n NAL',\n      scanOpacity: this.state.scan ? 0.55 : 0,\n      glowColor: this.hexA((SCREENS.find(s => s.key === this.state.screen) || SCREENS[0]).ph, this.state.glow ? (this.state.turbo ? 0.34 : 0.18) : 0.02),\n      dialDeg: dial ? dial.deg : 0,\n      gaugeCount: String(panelMode ? total : list.length).padStart(2,'0'),\n      countCaption: this.state.idle ? 'CORNERS' : 'COUNT',\n      countValue: this.state.idle\n        ? String(this.state.corners).padStart(2,'0')\n        : String(panelMode ? total : list.length).padStart(2,'0'),\n      countUnit: this.state.idle ? 'CORNERS' : 'ENTRIES',\n      countState: this.state.idle ? 'CLAIMED' : 'LOADED',\n      channels: CHANNELS.map(c => ({\n        label: c.label,\n        color: ch === c.key ? lit : dim,\n        glow: ch === c.key ? '0 0 10px ' + this.hexA(lit, .6) : 'none',\n        bg: ch === c.key ? this.hexA(lit, .09) : 'rgba(255,255,255,.015)',\n        select: () => this.setChannel(c.key)\n      })),\n      screens: SCREENS.map(s => ({\n        name: s.name, ph: s.ph, scr: s.scr,\n        border: this.state.screen === s.key ? s.ph : this.hexA(s.ph, .3),\n        select: () => { this.wake(); this.setState({ screen:s.key }); }\n      })),\n      vfds: VFDS.map(v => ({\n        ...v,\n        border: this.state.vfd === v.key ? 'var(--vfd)' : 'var(--ph-line)',\n        label_color: this.state.vfd === v.key ? 'var(--ph)' : 'var(--ph-dim)',\n        glow: '0 0 10px ' + this.hexA(v.hex, .7),\n        select: () => { this.wake(); this.setState({ vfd:v.key }); }\n      })),\n      nextChannel: () => {\n        const i = CHANNELS.findIndex(c => c.key === ch);\n        this.setChannel(CHANNELS[(i + 1) % CHANNELS.length].key);\n      },\n      switches: [ sw('scan','SCANLINE'), sw('glow','GLOW'), sw('persist','PERSIST') ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
